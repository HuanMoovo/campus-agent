name: Build desktop packages

# Builds the Windows installer, the macOS app (Intel + Apple silicon) and the Linux
# AppImage/deb. PyInstaller cannot cross-compile the bundled Python backend, so every
# platform (and every architecture) is built on its own runner.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'scripts/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS installer)
            runner: windows-latest
            target_os: win
            arch: x64
            args: --win nsis --x64
          - label: macOS x64 (dmg + zip)
            runner: macos-15-intel
            target_os: mac
            arch: x64
            args: --mac dmg zip --x64
          - label: macOS arm64 (dmg + zip)
            runner: macos-latest
            target_os: mac
            arch: arm64
            args: --mac dmg zip --arm64
          - label: Linux x64 (AppImage + deb)
            runner: ubuntu-latest
            target_os: linux
            arch: x64
            args: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build (install dependencies, run all suites, freeze backend, package)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python scripts/build_desktop.py --os ${{ matrix.target_os }} --arch ${{ matrix.arch }}

      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -e
          # 产物跑得起来才算通过：启动内置后端与界面，从调试端口取出内部地址后再退出。
          # 401 属于预期（桌面后端要求外壳注入的请求头），脚本会据此判定鉴权生效。
          case "${{ matrix.target_os }}" in
            win)
              installer=$(ls release/Mens-Setup-*.exe | head -n 1)
              echo "install: $installer"
              powershell -NoProfile -Command "Start-Process -FilePath '$(cygpath -w "$installer")' -ArgumentList '/S' -Wait"
              sleep 12
              python scripts/smoke_package.py \
                --command "${LOCALAPPDATA:-$HOME/AppData/Local}/Programs/Mens/Mens.exe" --expect Mens
              ;;
            mac)
              dmg=$(ls release/Mens-*.dmg | head -n 1)
              echo "attach: $dmg"
              hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/mens-dmg
              cp -R /tmp/mens-dmg/*.app /tmp/Mens.app
              hdiutil detach /tmp/mens-dmg -quiet
              xattr -dr com.apple.quarantine /tmp/Mens.app || true
              python scripts/smoke_package.py --command "/tmp/Mens.app/Contents/MacOS/Mens" --expect Mens
              ;;
            linux)
              appimage=$(ls release/*.AppImage | head -n 1)
              chmod +x "$appimage"
              command -v xvfb-run >/dev/null 2>&1 || sudo apt-get install -y -qq xvfb
              python scripts/smoke_package.py \
                --command "xvfb-run -a $appimage --appimage-extract-and-run --no-sandbox" --expect Mens
              ;;
          esac

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mens-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Mens ${GITHUB_REF_NAME}" --notes "见 VERIFICATION.md 的构建与验收记录。"
          # Never overwrite an artifact that is already attached: for the Windows installer the
          # release may already carry the locally built and verified package with the SHA-256
          # recorded in VERIFICATION.md. Later runs therefore only add missing files.
          existing=$(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name')
          for file in release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if printf '%s\n' "$existing" | grep -qx "$name"; then
              echo "kept existing asset $name"
              continue
            fi
            gh release upload "${GITHUB_REF_NAME}" "$file"
          done
