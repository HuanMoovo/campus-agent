name: CI

# The packaging workflow (build-desktop.yml) only runs on version tags, so this one keeps
# day-to-day work honest: every push to main and every pull request runs the three suites.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend, frontend and desktop suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Backend tests
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pytest -q

      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Desktop shell tests
        working-directory: desktop
        # backend.integration.cjs needs the frozen backend and runs in build-desktop.yml;
        # these are the shell, policy and version suites that need no packaging step.
        run: |
          npm ci
          node --test tests/main.test.cjs tests/policy.test.cjs tests/version.test.cjs

      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder-password/' .env
          sed -i 's/^ADMIN_TOKEN=$/ADMIN_TOKEN=ci-placeholder-token/' .env
          docker compose config --quiet
