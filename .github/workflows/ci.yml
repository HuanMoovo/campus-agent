name: CI

# The packaging workflow (build-desktop.yml) only runs on version tags, so this one keeps
# day-to-day work honest: every push to main and every pull request runs the three suites
# on Ubuntu, macOS and Windows. The Compose validation stays on Ubuntu because only that
# runner ships Docker.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv_python: ./.venv/bin/python
          - os: macos-latest
            venv_python: ./.venv/bin/python
          - os: windows-latest
            venv_python: ./.venv/Scripts/python.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend tests
        working-directory: backend
        run: |
          python -m venv .venv
          ${{ matrix.venv_python }} -m pip install --upgrade pip
          ${{ matrix.venv_python }} -m pip install -r requirements.txt
          ${{ matrix.venv_python }} -m pytest -q

      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Desktop shell tests
        working-directory: desktop
        # backend.integration.cjs needs the frozen backend and runs in build-desktop.yml;
        # these are the shell, policy and version suites that need no packaging step.
        run: |
          npm ci
          node --test tests/main.test.cjs tests/policy.test.cjs tests/version.test.cjs

      - name: Compose file is valid
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder-password/' .env
          sed -i 's/^ADMIN_TOKEN=$/ADMIN_TOKEN=ci-placeholder-token/' .env
          docker compose config --quiet
