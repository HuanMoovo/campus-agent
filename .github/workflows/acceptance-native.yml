name: Diagnostic standard native macOS launch using existing artifact

on:
  workflow_dispatch:
  push:
    branches:
      - codex/acceptance-native-20261101

permissions:
  contents: read
  actions: read

jobs:
  mac-arm64-standard-diagnostic:
    if: github.ref == 'refs/heads/codex/acceptance-native-20261101'
    name: Diagnostic macOS arm64 standard native launch on fresh VM
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse the exact previously built macOS arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: acceptance-native-mac-arm64
          run-id: '41271012516'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: diagnostic-input
      - name: Verify reused DMG and actual native runner architecture
        shell: python
        run: |
          import hashlib, json, pathlib, platform
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64', platform.platform()
          root = pathlib.Path('diagnostic-input')
          packages = list((root / 'release').glob('*.dmg'))
          assert len(packages) == 1, 'Exactly one actual DMG is required'
          package = packages[0]
          hasher = hashlib.sha256()
          with package.open('rb') as stream:
              for block in iter(lambda: stream.read(1048576), b''):
                  hasher.update(block)
          digest = hasher.hexdigest()
          previous = json.loads((root / 'acceptance-evidence/package-status.json').read_text())
          matches = [item for item in previous['packages'] if item['file'] == package.name]
          assert len(matches) == 1 and matches[0]['sha256'] == digest, 'Previous package checksum mismatch'
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir()
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'source_run_id': 41271012516, 'built_commit': 'fdceba925aa9a9f0e2c788c03a27dff52f640aeb',
                    'package': package.name, 'sha256': digest, 'bytes': package.stat().st_size,
                    'platform': platform.platform(), 'rebuilt': False,
                    'control_variable': 'standard native launch without additional test-only outer Seatbelt wrapper',
                    'outer_sandbox': 'none; standard-vm diagnostic only',
                    'actual_home_precondition': 'all eight app-owned paths absent before launch',
                    'actual_home_exception': 'only new regular own-UID preferences plist <=64 KiB; metadata only',
                    'renderer_sandbox_changed': False, 'quarantine_removed': False}
          (out / 'input.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Mount actual read-only DMG and collect standard native diagnostic
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find diagnostic-input/release -maxdepth 1 -name '*.dmg' -print -quit)
          mount=$(mktemp -d /tmp/mens-diagnostic-dmg.XXXXXX)
          install=$(mktemp -d /tmp/mens-diagnostic-install.XXXXXX)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          ditto "$mount/Mens.app" "$install/Mens.app"
          hdiutil detach "$mount" -quiet
          trap - EXIT
          # Preserve quarantine/signing and all product Electron sandbox settings.
          xattr -l "$install/Mens.app" > diagnostic-evidence/mac-extended-attributes.txt || true
          if python3 scripts/acceptance_native_smoke.py --package-kind mac-dmg --executable "$install/Mens.app/Contents/MacOS/Mens" --mac-launch-mode standard-vm --child-log-location state --diagnostic-only --out diagnostic-evidence/standard-vm; then
            code=0
          else
            code=$?
          fi
          printf 'standard-vm\t%s\n' "$code" > diagnostic-evidence/probe-exit-codes.tsv
      - name: Record diagnostic boundary and collected results
        if: always()
        shell: python
        run: |
          import json, pathlib
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir(exist_ok=True)
          path = out / 'standard-vm/native-result.json'
          result = json.loads(path.read_text()) if path.is_file() else {'error': 'Probe report missing'}
          result.update(diagnostic_only=True, accepted=False, manual_ui_review_pending=True)
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'job_success_is_acceptance': False, 'browser_automation_used': False,
                    'debugging_protocol_used': False, 'product_code_changed': False,
                    'purpose': 'Observe standard native launch after strict test wrapper produced helper sandbox EPERM',
                    'product_sandbox_overrides_supplied': False,
                    'result': result}
          (out / 'diagnostic-summary.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Retain small diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-evidence-mac-arm64-standard-vm
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
