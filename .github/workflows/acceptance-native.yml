name: Final native package evidence using unchanged built artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - codex/acceptance-native-20261101

permissions:
  contents: read
  actions: read

jobs:
  native-packages:
    if: github.ref == 'refs/heads/codex/acceptance-native-20261101'
    name: Native ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 DMG
            runner: macos-latest
            target_os: mac
            arch: arm64
            artifact: acceptance-native-mac-arm64
          - label: macOS x64 DMG
            runner: macos-15-intel
            target_os: mac
            arch: x64
            artifact: acceptance-native-mac-x64
          - label: Linux x64 AppImage and DEB
            runner: ubuntu-latest
            target_os: linux
            arch: x64
            artifact: acceptance-native-linux-x64
    env:
      TARGET_OS: ${{ matrix.target_os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse exact original run4 package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: '41271012516'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: final-native-input
      - name: Verify native architecture, unchanged product sources, and package provenance
        id: inputs
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, subprocess
          def sha(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1048576), b''):
                      digest.update(block)
              return digest.hexdigest()
          target, arch = os.environ['TARGET_OS'], os.environ['EXPECTED_ARCH']
          actual = {'arm64': 'arm64', 'aarch64': 'arm64', 'x86_64': 'x64', 'amd64': 'x64'}.get(platform.machine().lower())
          assert actual == arch and platform.system() == ('Darwin' if target == 'mac' else 'Linux'), platform.platform()
          excluded = {'.github/workflows/acceptance-native.yml', 'scripts/acceptance_native_smoke.py'}
          tracked = subprocess.run(['git', 'ls-files', '-z'], check=True, capture_output=True).stdout.decode().split('\0')
          names = sorted(name for name in tracked if name and name not in excluded)
          assert len(names) == 274
          manifest = ''.join(name + '\0' + sha(pathlib.Path(name)) + '\n' for name in names)
          product_digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert product_digest == '2c241ebd156b26b242987f636862b57c3422c355083e5adfab1beaf23ce84def', 'Product source changed from fdce'
          root = pathlib.Path('final-native-input')
          previous_path = root / 'acceptance-evidence/package-status.json'
          previous = json.loads(previous_path.read_text())
          patterns = {'mac-dmg': '*.dmg'} if target == 'mac' else {'linux-appimage': '*.AppImage', 'linux-deb': '*.deb'}
          packages = {}
          for case, pattern in patterns.items():
              candidates = list((root / 'release').glob(pattern))
              assert len(candidates) == 1, (case, len(candidates))
              package = candidates[0]
              digest = sha(package)
              matches = [item for item in previous['packages'] if item['file'] == package.name]
              assert len(matches) == 1 and matches[0]['sha256'] == digest, 'Run4 package checksum mismatch'
              packages[case] = {'file': package.name, 'bytes': package.stat().st_size, 'sha256': digest}
              prior_result = root / 'acceptance-evidence' / case / 'native-result.json'
              if prior_result.is_file():
                  old = json.loads(prior_result.read_text())
                  packages[case]['run4_result_sha256'] = sha(prior_result)
                  packages[case]['reference_executable_sha256'] = old.get('executable_sha256')
          out = pathlib.Path('final-native-evidence')
          out.mkdir()
          report = {'acceptance_run': True, 'diagnostic_only': False, 'accepted': False, 'manual_ui_review_pending': True,
                    'source_run_id': 41271012516, 'built_commit': 'fdceba925aa9a9f0e2c788c03a27dff52f640aeb',
                    'harness_commit': os.environ['GITHUB_SHA'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'probe_sha256': sha(pathlib.Path('scripts/acceptance_native_smoke.py')),
                    'workflow_sha256': sha(pathlib.Path('.github/workflows/acceptance-native.yml')),
                    'product_source_files': 274, 'product_manifest_sha256': product_digest,
                    'target_os': target, 'arch': arch, 'platform': platform.platform(), 'packages': packages,
                    'run4_package_status_sha256': sha(previous_path), 'rebuilt': False,
                    'product_sandbox_changed': False, 'quarantine_removed': False,
                    'linux_limit': 'Disposable runner uses --no-sandbox; no hardened sandbox claim',
                    'mac_home_exception': 'Only new regular own-UID preferences plist <=65536 bytes; metadata only',
                    'zip_scope': 'Run4 build/structural evidence only; not an additional launched case'}
          (out / 'input-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Launch actual read-only DMG application on fresh macOS VM
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find final-native-input/release -maxdepth 1 -name '*.dmg' -print -quit)
          mount=$(mktemp -d /tmp/mens-final-dmg.XXXXXX)
          install=$(mktemp -d /tmp/mens-final-install.XXXXXX)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          ditto "$mount/Mens.app" "$install/Mens.app"
          hdiutil detach "$mount" -quiet
          trap - EXIT
          # Preserve signing/quarantine and product renderer/GPU/network sandboxes.
          xattr -l "$install/Mens.app" > final-native-evidence/mac-extended-attributes.txt || true
          python3 scripts/acceptance_native_smoke.py --package-kind mac-dmg --executable "$install/Mens.app/Contents/MacOS/Mens" --mac-launch-mode standard-vm --child-log-location state --acceptance-run --out final-native-evidence/mac-dmg
      - name: Install disposable Linux native GUI prerequisites
        id: prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils imagemagick lsof libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1
      - name: Launch actual Linux AppImage with explicit existing sandbox limitation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find final-native-input/release -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' python3 scripts/acceptance_native_smoke.py --package-kind appimage --executable "$appimage" --argument=--appimage-extract-and-run --argument=--no-sandbox --child-log-location state --acceptance-run --out final-native-evidence/linux-appimage
      - name: Install actual DEB and launch its validated package-owned desktop Exec
        if: always() && runner.os == 'Linux' && steps.inputs.outcome == 'success' && steps.prerequisites.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find final-native-input/release -maxdepth 1 -name '*.deb' -print -quit)
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$(pwd)/$deb"
          xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' python3 scripts/acceptance_native_smoke.py --package-kind deb --installed-deb "$deb" --argument=--no-sandbox --child-log-location state --acceptance-run --out final-native-evidence/linux-deb
      - name: Gate every native requirement and bind results to immutable inputs
        if: always()
        shell: python
        run: |
          import hashlib, importlib.util, json, os, pathlib, sys
          sys.dont_write_bytecode = True
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          out = pathlib.Path('final-native-evidence')
          out.mkdir(exist_ok=True)
          input_path = out / 'input-provenance.json'
          errors, cases = [], []
          target, arch = os.environ['TARGET_OS'], os.environ['EXPECTED_ARCH']
          expected = {'mac-dmg': 'mac-dmg'} if target == 'mac' else {'linux-appimage': 'appimage', 'linux-deb': 'deb'}
          provenance = json.loads(input_path.read_text()) if input_path.is_file() else {}
          spec = importlib.util.spec_from_file_location('native_probe', 'scripts/acceptance_native_smoke.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for case, kind in expected.items():
              path = out / case / 'native-result.json'
              row = {'case': target + '-' + arch + '-' + kind, 'native_evidence_passed': False}
              try:
                  assert provenance['acceptance_run'] is True and provenance['diagnostic_only'] is False
                  assert provenance['accepted'] is False and provenance['manual_ui_review_pending'] is True
                  assert provenance['target_os'] == target and provenance['arch'] == arch
                  assert provenance['probe_sha256'] == sha(pathlib.Path('scripts/acceptance_native_smoke.py'))
                  result = json.loads(path.read_text())
                  assert result['acceptance_run'] is True and result['diagnostic_only'] is False
                  assert result['accepted'] is False and result['manual_ui_review_pending'] is True
                  assert result['status'] == 'passed-native-window-backend-and-isolated-db-manual-screenshot-review-required'
                  assert result['exit_code'] == 0 and result['native_evidence_status'] == 'passed-manual-ui-review-pending'
                  assert result['native_evidence_requirements_met'] is True and result['package_kind'] == kind
                  assert result['platform'] == ('darwin' if target == 'mac' else 'linux')
                  for key in ('native_window_verified', 'isolated_database_verified', 'owned_backend_auth_verified',
                              'screenshot_captured', 'fresh_isolated_state_verified', 'only_own_process_group_signaled'):
                      assert result[key] is True, key
                  assert result['remaining_own_processes'] == [] and not result.get('cleanup_error')
                  assert result['application_running_before_cleanup'] is True
                  assert result['application_returncode_before_cleanup'] is None
                  assert not result.get('real_home_side_effect_error')
                  assert result['child_log_location'] == 'state' and result['cursor_included'] is False
                  assert result['browser_automation_used'] is False and result['debugging_protocol_used'] is False
                  assert result['fully_loaded_ui_verified'] is False and result['ui_feature_interactions_verified'] is False
                  assert result['screenshot_manual_content_review'] == 'pending'
                  state = pathlib.Path(result['isolated_state_root'])
                  assert pathlib.Path(result['launch_home']) == state / 'home'
                  assert result['launch_cffixed_user_home'] == result['launch_home']
                  assert pathlib.Path(result['working_directory']) == state
                  data = state / ('home/Library/Application Support/CampusAgent' if target == 'mac' else 'config/CampusAgent')
                  assert pathlib.Path(result['expected_app_data']) == data and result['database_bytes'] >= 16
                  backend = result['backend']
                  assert backend['address'] == '127.0.0.1' and backend['unauthenticated_status'] == 401
                  assert backend['desktop_token_supplied'] is False
                  assert backend['pid'] in {item['pid'] for item in result['processes']}
                  if target == 'mac':
                      assert result['mac_launch_mode'] == 'standard-vm' and result['outer_sandbox_applied'] is False
                      assert result['outer_sandbox_profile'] is None and result['product_sandbox_overrides_supplied'] is False
                      assert result['standard_vm_fresh_actual_home_verified'] is True
                      audit = probe.standard_home_after(result['actual_home_app_paths_before'], result['actual_home_app_paths_after'], os.getuid())
                      assert audit['passed'] is True and result['standard_vm_actual_home_audit'] == audit
                      row['actual_home_audit'] = audit
                  else:
                      assert result['linux_no_sandbox_launch'] is True
                      row['linux_limit'] = 'Disposable runner --no-sandbox; no hardened sandbox claim'
                  screenshot = out / case / result['screenshot']
                  assert screenshot.name == 'native-window.png' and screenshot.stat().st_size >= 1000
                  assert screenshot.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
                  assert sha(screenshot) == result['screenshot_sha256']
                  package = provenance['packages'][case]
                  reference = package.get('reference_executable_sha256')
                  if reference:
                      assert reference == result['executable_sha256'], 'Executable differs from the original run4 package probe'
                  row.update(native_evidence_passed=True, native_result_sha256=sha(path), screenshot_sha256=sha(screenshot),
                             executable_sha256=result['executable_sha256'], package_sha256=package['sha256'],
                             input_provenance_sha256=sha(input_path))
              except Exception as error:
                  row['error'] = type(error).__name__ + ': ' + str(error)
                  errors.append(row['case'] + ': ' + row['error'])
              cases.append(row)
          summary = {'acceptance_run': True, 'diagnostic_only': False, 'accepted': False, 'manual_ui_review_pending': True,
                     'status': 'failed' if errors else 'passed-native-evidence-manual-ui-review-pending',
                     'job_success_is_final_acceptance': False, 'cases': cases, 'errors': errors,
                     'acceptance_scope': 'Native window, owned backend HTTP401, isolated SQLite, cleanup; screenshots require direct review',
                     'unverified': ['UI feature interactions', 'fully loaded UI', 'Gatekeeper', 'signing/notarization', 'Electron sandbox verification']}
          (out / 'native-evidence-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          sys.exit(1 if errors else 0)
      - name: Retain small native evidence for direct screenshot review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-native-evidence-${{ matrix.target_os }}-${{ matrix.arch }}
          path: final-native-evidence/
          if-no-files-found: error
          retention-days: 7
