name: Diagnostic native artifact reuse without browser automation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/acceptance-native-20261101

permissions:
  contents: read
  actions: read

jobs:
  mac-arm64-log-diagnostic:
    if: github.ref == 'refs/heads/codex/acceptance-native-20261101'
    name: Diagnostic macOS arm64 strict sandbox child log A-B
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse the exact previously built macOS arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: acceptance-native-mac-arm64
          run-id: '41271012516'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: diagnostic-input
      - name: Verify reused DMG and actual native runner architecture
        shell: python
        run: |
          import hashlib, json, pathlib, platform
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64', platform.platform()
          root = pathlib.Path('diagnostic-input')
          packages = list((root / 'release').glob('*.dmg'))
          assert len(packages) == 1, 'Exactly one actual DMG is required'
          package = packages[0]
          hasher = hashlib.sha256()
          with package.open('rb') as stream:
              for block in iter(lambda: stream.read(1048576), b''):
                  hasher.update(block)
          digest = hasher.hexdigest()
          previous = json.loads((root / 'acceptance-evidence/package-status.json').read_text())
          matches = [item for item in previous['packages'] if item['file'] == package.name]
          assert len(matches) == 1 and matches[0]['sha256'] == digest, 'Previous package checksum mismatch'
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir()
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'source_run_id': 41271012516, 'built_commit': 'fdceba925aa9a9f0e2c788c03a27dff52f640aeb',
                    'package': package.name, 'sha256': digest, 'bytes': package.stat().st_size,
                    'platform': platform.platform(), 'rebuilt': False,
                    'control_variable': 'child stdout/stderr file location: denied workspace vs allowed private /tmp',
                    'outer_sandbox': 'original deny actual HOME in both controls',
                    'renderer_sandbox_changed': False, 'quarantine_removed': False}
          (out / 'input.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Mount actual read-only DMG and run both strict-profile log controls
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find diagnostic-input/release -maxdepth 1 -name '*.dmg' -print -quit)
          mount=$(mktemp -d /tmp/mens-diagnostic-dmg.XXXXXX)
          install=$(mktemp -d /tmp/mens-diagnostic-install.XXXXXX)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          ditto "$mount/Mens.app" "$install/Mens.app"
          hdiutil detach "$mount" -quiet
          trap - EXIT
          # Preserve quarantine and signing. Launch this same copied binary twice.
          xattr -l "$install/Mens.app" > diagnostic-evidence/mac-extended-attributes.txt || true
          for location in workspace state; do
            if python3 scripts/acceptance_native_smoke.py --package-kind mac-dmg --executable "$install/Mens.app/Contents/MacOS/Mens" --child-log-location "$location" --diagnostic-only --out "diagnostic-evidence/log-$location"; then
              code=0
            else
              code=$?
            fi
            printf '%s\t%s\n' "$location" "$code" >> diagnostic-evidence/probe-exit-codes.tsv
          done
      - name: Record diagnostic boundary and collected results
        if: always()
        shell: python
        run: |
          import json, pathlib
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir(exist_ok=True)
          results = []
          for location in ('workspace', 'state'):
              path = out / ('log-' + location) / 'native-result.json'
              result = json.loads(path.read_text()) if path.is_file() else {'error': 'Probe report missing'}
              result.update(diagnostic_only=True, accepted=False, manual_ui_review_pending=True)
              results.append({'child_log_location': location, 'result': result})
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'job_success_is_acceptance': False, 'browser_automation_used': False,
                    'debugging_protocol_used': False, 'product_code_changed': False,
                    'purpose': 'Test child-fd metadata denial hypothesis while preserving strict HOME sandbox',
                    'results': results}
          (out / 'diagnostic-summary.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Retain small diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-evidence-mac-arm64-log-location
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7

  linux-deb-exec-diagnostic:
    if: github.ref == 'refs/heads/codex/acceptance-native-20261101'
    name: Diagnostic Linux x64 package-owned desktop Exec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse the exact previously built Linux x64 packages
        uses: actions/download-artifact@v4
        with:
          name: acceptance-native-linux-x64
          run-id: '41271012516'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: diagnostic-input
      - name: Verify reused DEB and actual native runner architecture
        shell: python
        run: |
          import hashlib, json, pathlib, platform
          assert platform.system() == 'Linux' and platform.machine() == 'x86_64', platform.platform()
          root = pathlib.Path('diagnostic-input')
          packages = list((root / 'release').glob('*.deb'))
          assert len(packages) == 1, 'Exactly one actual DEB is required'
          package = packages[0]
          hasher = hashlib.sha256()
          with package.open('rb') as stream:
              for block in iter(lambda: stream.read(1048576), b''):
                  hasher.update(block)
          digest = hasher.hexdigest()
          previous = json.loads((root / 'acceptance-evidence/package-status.json').read_text())
          matches = [item for item in previous['packages'] if item['file'] == package.name]
          assert len(matches) == 1 and matches[0]['sha256'] == digest, 'Previous package checksum mismatch'
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir()
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'source_run_id': 41271012516, 'built_commit': 'fdceba925aa9a9f0e2c788c03a27dff52f640aeb',
                    'package': package.name, 'sha256': digest, 'bytes': package.stat().st_size,
                    'platform': platform.platform(), 'rebuilt': False,
                    'control_variable': 'resolve application from validated package-owned desktop Exec',
                    'linux_no_sandbox_launch': True, 'electron_sandbox_verified': False}
          (out / 'input.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Install native GUI dependencies and actual reused DEB on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils imagemagick lsof libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1
          deb=$(find diagnostic-input/release -maxdepth 1 -name '*.deb' -print -quit)
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$(pwd)/$deb"
      - name: Inspect installed package-owned desktop Exec and collect unchanged native requirements
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find diagnostic-input/release -maxdepth 1 -name '*.deb' -print -quit)
          if xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' python3 scripts/acceptance_native_smoke.py --package-kind deb --installed-deb "$deb" --argument=--no-sandbox --diagnostic-only --out diagnostic-evidence/linux-deb; then
            code=0
          else
            code=$?
          fi
          printf 'deb\t%s\n' "$code" > diagnostic-evidence/probe-exit-codes.tsv
      - name: Record diagnostic boundary and collected result
        if: always()
        shell: python
        run: |
          import json, pathlib
          out = pathlib.Path('diagnostic-evidence')
          out.mkdir(exist_ok=True)
          path = out / 'linux-deb/native-result.json'
          result = json.loads(path.read_text()) if path.is_file() else {'error': 'Probe report missing'}
          result.update(diagnostic_only=True, accepted=False, manual_ui_review_pending=True)
          report = {'diagnostic_only': True, 'accepted': False, 'manual_ui_review_pending': True,
                    'job_success_is_acceptance': False, 'browser_automation_used': False,
                    'debugging_protocol_used': False, 'product_code_changed': False, 'result': result}
          (out / 'diagnostic-summary.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Retain small diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-evidence-linux-x64-deb-exec
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
