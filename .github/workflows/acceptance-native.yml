name: Corrective full suites on exact MAIN candidate
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ADMIN_TOKEN: test-admin-token
      ENABLE_RAG: 'false'
      QWEN_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          venv_python: ./.venv/bin/python
        - os: macos-latest
          venv_python: ./.venv/bin/python
        - os: windows-latest
          venv_python: ./.venv/Scripts/python.exe
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Use an owned temporary directory for test fixtures
      shell: python
      run: "import os\nfrom pathlib import Path\n# macOS /private ancestry is denied\
        \ by the project-file privacy policy.\n# Keep test fixtures in a physical,\
        \ runner-owned directory instead.\ndirectory = (Path(os.environ['RUNNER_TEMP'])\
        \ / 'mens-test-temp').resolve()\ndirectory.mkdir(parents=True, exist_ok=True)\n\
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:\n  \
        \  for name in ('TMPDIR', 'TEMP', 'TMP'):\n        output.write(f'{name}={directory}\\\
        n')\n"
    - name: Backend tests
      working-directory: backend
      run: 'python -m venv .venv

        ${{ matrix.venv_python }} -m pip install --upgrade pip

        ${{ matrix.venv_python }} -m pip install -r requirements.txt

        ${{ matrix.venv_python }} -m pytest -q

        '
    - name: Frontend tests and production build
      working-directory: frontend
      run: 'npm ci

        npm test

        npm run build

        '
    - name: Desktop shell tests
      working-directory: desktop
      run: 'npm ci

        npm test

        '
    - name: Release preparation and signing regressions
      run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
    - name: Compose file is valid
      if: matrix.os == 'ubuntu-latest'
      run: 'cp .env.example .env

        sed -i ''s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder-password/''
        .env

        sed -i ''s/^ADMIN_TOKEN=$/ADMIN_TOKEN=ci-placeholder-token/'' .env

        docker compose config --quiet

        '
    if: github.ref == 'refs/heads/codex/acceptance-native-20261101'
'on':
  push:
    branches:
    - codex/acceptance-native-20261101
  workflow_dispatch: null
